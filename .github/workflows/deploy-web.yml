# Build obrazu PWA → GHCR → wdrożenie na VPS przez SSH.
#
# Konfiguracja Firebase wchodzi jako --build-arg, bo jest wypalana w bundlu
# (szczegóły w docs/deployment-web.md). Sekrety w repo:
#
#   FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_PROJECT_ID,
#   FIREBASE_STORAGE_BUCKET, FIREBASE_MESSAGING_SENDER_ID, FIREBASE_APP_ID,
#   FIREBASE_MEASUREMENT_ID (opcjonalny)
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH, VPS_PORT (opcjonalny, domyślnie 22)

name: Deploy web (PWA)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'assets/**'
      - 'App.tsx'
      - 'index.ts'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR wymaga nazw w małych literach, a login GitHuba może mieć wielkie.
      - name: Resolve image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/zing-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
            FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Potrzebny po to, by wysłać na serwer docker-compose.yml z repo — wersja
      # na serwerze nie może się rozjechać z tą, która jest w historii.
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::Sekret VPS_HOST jest pusty — ustaw go w Settings → Secrets → Actions"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # TOFU: pobieramy klucz hosta przy każdym wdrożeniu. Mocniejszy
          # wariant opisany w docs/deployment-web.md (sekcja Bezpieczeństwo).
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship compose file
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          TARGET="${VPS_PATH:-/opt/zing}"
          echo "Katalog docelowy: $TARGET"
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$TARGET'"
          scp -i ~/.ssh/id_deploy -P "${VPS_PORT:-22}" \
            docker-compose.yml "$VPS_USER@$VPS_HOST:$TARGET/docker-compose.yml"

      - name: Pull and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          IMAGE: ${{ needs.build.outputs.image }}
          SHA: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            ZING_IMAGE="$IMAGE:$SHA" \
            TARGET="${VPS_PATH:-/opt/zing}" \
            REGISTRY_USER="$REGISTRY_USER" \
            REGISTRY_TOKEN="$REGISTRY_TOKEN" \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          cd "$TARGET"
          if [ ! -f docker-compose.yml ]; then
            echo "BŁĄD: brak docker-compose.yml w $TARGET" >&2
            exit 1
          fi
          # Przypinamy konkretny SHA, żeby rollback był jedną zmianą zmiennej.
          export ZING_IMAGE
          docker compose pull web
          docker compose up -d web
          docker image prune -f
          REMOTE

      - name: Verify health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -uo pipefail

          # Czekamy do 90 s. Status jest wypisywany, bo "starting" i "unhealthy"
          # to dwie zupełnie różne diagnozy, a poprzednia wersja tego kroku
          # pokazywała tylko, że się nie udało.
          for i in $(seq 1 30); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' zing-web 2>/dev/null || echo "brak-kontenera")
            if [ "$STATUS" = "healthy" ]; then
              echo "zing-web: healthy (po ~$((i * 3)) s)"
              exit 0
            fi
            [ $((i % 5)) -eq 1 ] && echo "  ...status: $STATUS"
            sleep 3
          done

          echo "zing-web nie zgłosił healthy w 90 s (ostatni status: ${STATUS:-nieznany})" >&2
          echo
          # Rozstrzygamy trzy różne przyczyny, które dają ten sam objaw
          # "unhealthy": brak wgeta w obrazie, nginx nasłuchujący tylko na IPv4
          # przy localhost rozwiązywanym na ::1, albo faktycznie leżący nginx.
          echo "--- diagnostyka wnętrza kontenera ---"
          echo -n "  wget obecny:        "
          docker exec zing-web sh -c 'command -v wget >/dev/null && echo tak || echo NIE — health check nie ma czym odpytać'
          echo -n "  GET 127.0.0.1:      "
          docker exec zing-web wget -q -O- http://127.0.0.1/health 2>&1 | head -1 || echo "bez odpowiedzi"
          echo -n "  GET [::1]:          "
          docker exec zing-web wget -q -O- 'http://[::1]/health' 2>&1 | head -1 || echo "bez odpowiedzi (nginx nie słucha na IPv6)"
          echo "  nasłuchy nginxa:"
          docker exec zing-web grep -nE '^\s*listen' /etc/nginx/conf.d/default.conf | sed 's/^/    /'
          echo
          echo "--- docker ps ---"
          docker ps -a --filter name=zing-web --format '{{.Status}}'
          echo
          echo "--- logi kontenera ---"
          docker logs --tail 50 zing-web 2>&1
          exit 1
          REMOTE
