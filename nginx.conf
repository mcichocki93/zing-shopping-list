# nginx.conf — serwowanie statycznego builda Zing PWA.
#
# Najważniejsza rzecz w tym pliku to polityka cache. Zasoby pod /_expo/static/
# mają hash w nazwie, więc mogą leżeć w cache rok. Ale index.html i sw.js MUSZĄ
# być no-cache: jeśli przeglądarka zapamięta stary service worker albo stary
# index.html wskazujący na nieistniejący już bundle, użytkownik zostaje
# uwięziony w poprzedniej wersji i żadne wdrożenie go nie odratuje.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml font/ttf font/woff font/woff2;

    # Dla reverse proxy / load balancera. Nie dotyka logów dostępowych.
    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Service worker — zawsze świeży, inaczej aktualizacje nie dochodzą.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Powłoka aplikacji — zawsze świeża.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # Zahashowane bundle i zasoby — niezmienne.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # SPA: routing jest po stronie klienta (React Navigation), więc każda
    # nieznana ścieżka musi dostać index.html, nie 404.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
